plugins {
    id 'com.android.application'
}

android {
    namespace 'br.tvtcl.inicio'
    compileSdk 34

    defaultConfig {
        applicationId 'br.tvtcl.inicio'
        minSdk 30
        targetSdk 30
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
